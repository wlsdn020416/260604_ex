<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Google과 Groq 모델을 선택해 질문하고, 마크다운 답변을 확인할 수 있는 AI 챗봇입니다."
    />
    <meta name="keywords" content="AI 챗봇, Gemini, Groq, Google AI, 마크다운 답변, 인공지능 채팅" />
    <meta name="author" content="AI 챗봇" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#2d2a2e" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="AI 챗봇 | Google & Groq 모델 채팅" />
    <meta
      property="og:description"
      content="Google과 Groq 모델을 선택해 프롬프트를 입력하고 마크다운 답변을 받아보세요."
    />
    <meta property="og:image" content="favicon.svg" />
    <meta property="og:site_name" content="AI 챗봇" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AI 챗봇 | Google & Groq 모델 채팅" />
    <meta
      name="twitter:description"
      content="Google과 Groq 모델을 선택해 프롬프트를 입력하고 마크다운 답변을 받아보세요."
    />
    <meta name="twitter:image" content="favicon.svg" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="canonical" href="./" />
    <title>AI 챗봇 | Google & Groq 모델 채팅</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 3.5 14.6 9l5.9.8-4.3 4.1 1 5.8L12 16.9 6.8 19.7l1-5.8-4.3-4.1L9.4 9 12 3.5Z"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                />
              </svg>
            </div>
            <h1>AI 챗봇</h1>
          </div>
          <div class="topbar-actions">
            <button class="utility-button" id="newChatButton" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
              </svg>
              <span>새 채팅</span>
            </button>
            <button class="utility-button" id="chatListButton" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M8 7h13M8 12h13M8 17h13M3 7h.01M3 12h.01M3 17h.01"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="2"
                />
              </svg>
              <span>채팅 목록</span>
            </button>
          </div>
        </div>
      </header>

      <section class="chat-shell">
        <div id="chatContainer" aria-live="polite">
          <div class="empty-state" id="emptyState">
            <div class="empty-content">
              <div class="empty-visual" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path
                    d="M7 8h10M7 12h6m8-1c0 4.4-4 8-9 8-1 0-2-.1-2.9-.4L4 20l1.6-4.1A7.2 7.2 0 0 1 3 11c0-4.4 4-8 9-8s9 3.6 9 8Z"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                  />
                </svg>
              </div>
              <strong>무엇을 도와드릴까요?</strong>
              <p>아래 입력창에서 모델을 작게 설정하고 바로 질문을 시작하세요. 답변은 마크다운으로 표시됩니다.</p>
            </div>
          </div>
        </div>

        <div class="composer-wrap">
          <form id="chatForm">
            <div class="settings-row" aria-label="모델 설정">
              <label class="mini-field">
                Provider
                <select name="provider">
                  <option value="google">Google</option>
                  <option value="groq">Groq</option>
                </select>
              </label>

              <label class="mini-field">
                Model
                <select name="model">
                  <option value="gemma-4-26b-a4b-it">Gemma 4 26B</option>
                  <option value="openai/gpt-oss-120b">GPT OSS 120B</option>
                </select>
              </label>
            </div>

            <div class="input-row">
              <textarea name="ask" placeholder="프롬프트를 입력하세요"></textarea>
              <button class="send-button" type="submit" aria-label="보내기">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="m5 12 14-7-4 14-3-6-7-1Z"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.9"
                  />
                </svg>
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="chat-drawer" id="chatDrawer" aria-label="채팅 목록">
      <div class="drawer-header">
        <h2>채팅 목록</h2>
        <button class="icon-button" id="closeDrawerButton" type="button" aria-label="채팅 목록 닫기">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
          </svg>
        </button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </aside>

    <script src="app.js"></script>
  </body>
</html>
